name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native (${{ matrix.suite }})
    runs-on: macos-26
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: extended catalog
            filter: -only-testing:BehaviorCatalogUITests/ExtendedCatalogTests
          - suite: adapters and catalog
            filter: -skip-testing:BehaviorCatalogUITests/ExtendedCatalogTests
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        if: matrix.suite == 'adapters and catalog'
      - run: brew install xcodegen
      - run: xcodegen generate --spec Examples/project.yml
      - name: Start simulator
        timeout-minutes: 3
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
      - name: Build iOS catalog and adapter tests
        timeout-minutes: 8
        run: >-
          xcodebuild -quiet -project Examples/BehaviorCatalog.xcodeproj
          -scheme BehaviorCatalog
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Await simulator startup
        timeout-minutes: 8
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Simulator replay
        # Each runner uses its own simulator. Keep retries and result bundles
        # while each suite stays below the former serial replay budget.
        timeout-minutes: 12
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: >-
          xcodebuild -project Examples/BehaviorCatalog.xcodeproj
          -scheme BehaviorCatalog
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$(uname -m)"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          "$TEST_FILTER" -parallel-testing-enabled NO -test-timeouts-enabled YES
          -collect-test-diagnostics never
          -maximum-test-execution-time-allowance 120
          -retry-tests-on-failure -test-iterations 2
          -test-repetition-relaunch-enabled YES
          -resultBundlePath "$RUNNER_TEMP/NativeReplay.xcresult"
          CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Preserve native replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-replay-${{ strategy.job-index }}
          path: ${{ runner.temp }}/NativeReplay.xcresult
          retention-days: 2
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check component recipe sources
        run: python3 scripts/build-component-recipes.py --check
      - name: Check website scripts
        run: |
          for source in site/demo.js site/motion.js scripts/render-hero-film.mjs site/docs/*.js; do node --check "$source"; done
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/docs-browser" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/docs-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Replay documentation interactions
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/docs-browser/node_modules/playwright/index.mjs" node site/tests/browser.mjs
