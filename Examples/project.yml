name: BehaviorCatalog
options:
  bundleIdPrefix: dev.iosui
  deploymentTarget:
    iOS: "17.0"
packages:
  iosUI-sdk:
    path: ..
targets:
  BehaviorCatalog:
    type: application
    platform: iOS
    sources: [Catalog]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosui.catalog
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: iosUI-sdk
        product: UIBehaviorSwiftUI
      - package: iosUI-sdk
        product: UIBehaviorUIKit
      - package: iosUI-sdk
        product: UIBehaviorCore
  BehaviorAdapterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AdapterTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: BehaviorCatalog
      - package: iosUI-sdk
        product: UIBehaviorUIKit
      - package: iosUI-sdk
        product: UIBehaviorCore
      - package: iosUI-sdk
        product: UIBehaviorSwiftUI
  BehaviorCatalogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: BehaviorCatalog
schemes:
  BehaviorCatalog:
    build:
      targets:
        BehaviorCatalog: all
    test:
      targets:
        - BehaviorAdapterTests
        - name: BehaviorCatalogUITests
          skippedTests: [ReadmeCaptureTests, RecipeMotionCaptureTests]
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: true
      preferredScreenCaptureFormat: screenshots

  ReadmeCapture:
    build:
      targets:
        BehaviorCatalog: all
    test:
      targets: [BehaviorCatalogUITests]
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      preferredScreenCaptureFormat: screenRecording
